<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Loan Approval Prediction System
    </title>


    <!-- Flask Static CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==================================
         MAIN CONTAINER
    =================================== -->

    <div class="container">


        <!-- ==================================
             HEADER
        =================================== -->

        <div class="header">

            <div class="icon">
                💰
            </div>

            <h1>
                Loan Approval Prediction
            </h1>

            <p>
                Machine Learning Based Loan Approval System
            </p>

        </div>


        <!-- ==================================
             FORM CONTAINER
        =================================== -->

        <div class="form-container">


            <form id="loanForm">


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- Married -->

                <div class="form-group">

                    <label for="married">
                        Married
                    </label>

                    <select id="married">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Dependents -->

                <div class="form-group">

                    <label for="dependents">
                        Dependents
                    </label>

                    <select id="dependents">

                        <option value="0">
                            0
                        </option>

                        <option value="1">
                            1
                        </option>

                        <option value="2">
                            2
                        </option>

                        <option value="3+">
                            3+
                        </option>

                    </select>

                </div>


                <!-- Education -->

                <div class="form-group">

                    <label for="education">
                        Education
                    </label>

                    <select id="education">

                        <option value="Graduate">
                            Graduate
                        </option>

                        <option value="Not Graduate">
                            Not Graduate
                        </option>

                    </select>

                </div>


                <!-- Self Employed -->

                <div class="form-group">

                    <label for="self_employed">
                        Self Employed
                    </label>

                    <select id="self_employed">

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </div>


                <!-- Applicant Income -->

                <div class="form-group">

                    <label for="applicant_income">
                        Applicant Income
                    </label>

                    <input
                        type="number"
                        id="applicant_income"
                        placeholder="Enter applicant income"
                        min="0"
                        required
                    >

                </div>


                <!-- Coapplicant Income -->

                <div class="form-group">

                    <label for="coapplicant_income">
                        Coapplicant Income
                    </label>

                    <input
                        type="number"
                        id="coapplicant_income"
                        placeholder="Enter coapplicant income"
                        min="0"
                        required
                    >

                </div>


                <!-- Loan Amount -->

                <div class="form-group">

                    <label for="loan_amount">
                        Loan Amount
                    </label>

                    <input
                        type="number"
                        id="loan_amount"
                        placeholder="Enter loan amount"
                        min="0"
                        required
                    >

                </div>


                <!-- Loan Term -->

                <div class="form-group">

                    <label for="loan_term">
                        Loan Amount Term
                    </label>

                    <select id="loan_term">

                        <option value="360">
                            360 Months
                        </option>

                        <option value="180">
                            180 Months
                        </option>

                        <option value="240">
                            240 Months
                        </option>

                        <option value="120">
                            120 Months
                        </option>

                    </select>

                </div>


                <!-- Credit History -->

                <div class="form-group">

                    <label for="credit_history">
                        Credit History
                    </label>

                    <select id="credit_history">

                        <option value="1">
                            Good
                        </option>

                        <option value="0">
                            Bad
                        </option>

                    </select>

                </div>


                <!-- Property Area -->

                <div class="form-group">

                    <label for="property_area">
                        Property Area
                    </label>

                    <select id="property_area">

                        <option value="Urban">
                            Urban
                        </option>

                        <option value="Semiurban">
                            Semiurban
                        </option>

                        <option value="Rural">
                            Rural
                        </option>

                    </select>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    id="predictButton"
                >

                    🔍 Predict Loan Approval

                </button>


            </form>


            <!-- ==================================
                 RESULT
            =================================== -->

            <div
                id="result"
                class="result"
            >

            </div>


        </div>


        <!-- ==================================
             FOOTER
        =================================== -->

        <div class="footer">

            <p>
                🤖 Powered by Machine Learning
            </p>

        </div>


    </div>


    <!-- Flask Static JavaScript -->

    <script
        src="{{ url_for('static', filename='script.js') }}"
    >
    </script>


</body>

</html>
